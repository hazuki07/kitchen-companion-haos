<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b32">
  <meta name="description" content="音声と大きな画面で料理を進められる、Home Assistant向け料理アシスタント">
  <title>Kitchen Companion</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111b32'/%3E%3Cpath d='M15 30h34v7a17 17 0 0 1-34 0z' fill='%23f5a623'/%3E%3Cpath d='M21 18c6 2 3 7 0 9M32 15c6 3 3 8 0 11M43 18c5 2 3 7 0 9' fill='none' stroke='%23f6f1e8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="レシピ一覧へ">
        <span class="brand-mark" aria-hidden="true">♨</span>
        <span><strong>Kitchen Companion</strong><small>きょうの料理を、いっしょに。</small></span>
      </button>
      <div class="top-actions">
        <span class="status-chip" id="runtimeStatus"><span></span> 接続状態を確認中</span>
        <button class="icon-button" data-action="open-editor" aria-label="レシピを登録">＋</button>
      </div>
    </header>

    <main>
      <section class="home-view" id="homeView">
        <div class="search-stage">
          <div>
            <p class="eyebrow">MY RECIPE LIBRARY</p>
            <h1>今日は、何を作りますか？</h1>
          </div>
          <form class="search-box" id="searchForm">
            <label class="sr-only" for="searchInput">レシピを検索</label>
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="料理名・材料・国・料理人で検索" autocomplete="off">
            <button type="button" class="voice-button" id="voiceSearch" aria-label="音声で検索">●<span>話す</span></button>
          </form>
          <div class="quick-search" aria-label="検索例">
            <button data-query="鶏肉">鶏肉</button><button data-query="かんたん">20分以内</button><button data-query="野菜">野菜たっぷり</button>
          </div>
        </div>

        <div class="content-grid">
          <section>
            <div class="section-heading">
              <div><p class="eyebrow">SAVED RECIPES</p><h2>登録したレシピ</h2></div>
              <button class="text-button" data-action="open-editor">新しく登録</button>
            </div>
            <div id="recipeGrid" class="recipe-grid" aria-live="polite"></div>
          </section>

          <aside class="side-panel">
            <div class="import-card">
              <span class="feature-icon" aria-hidden="true">↗</span>
              <p class="eyebrow">FROM THE WEB</p>
              <h2>お気に入りを持ち込む</h2>
              <p>レシピサイトのURLから、材料と工程を下書きにします。保存前に内容を確認できます。</p>
              <form id="importForm">
                <label for="importUrl">レシピページのURL</label>
                <input id="importUrl" type="url" placeholder="https://…" required>
                <button class="primary-button" type="submit">URLから読み込む</button>
              </form>
              <button class="secondary-button" data-action="open-editor" data-kind="video">動画を登録する</button>
            </div>
            <div class="tip-card">
              <strong>声で探せます</strong>
              <p>マイクを押して「鶏肉を使った料理」のように話してください。</p>
            </div>
          </aside>
        </div>
      </section>

      <section class="detail-view hidden" id="detailView" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="editorDialog" class="editor-dialog">
    <form id="recipeForm" method="dialog">
      <div class="dialog-heading">
        <div><p class="eyebrow">RECIPE NOTE</p><h2 id="editorTitle">レシピを登録</h2></div>
        <button type="button" class="icon-button" data-action="close-editor" aria-label="閉じる">×</button>
      </div>
      <input type="hidden" id="recipeId">
      <div class="form-grid">
        <label class="wide">料理名<input id="titleField" required maxlength="160" placeholder="例：トマトと卵の炒めもの"></label>
        <label>基準の人数<input id="servingsField" type="number" min="0.5" max="100" step="0.5" value="2" required></label>
        <label>タグ<input id="tagsField" placeholder="中華, 20分, 卵"></label>
        <label class="wide">ひとこと<textarea id="descriptionField" rows="2" placeholder="味や作り方のメモ"></textarea></label>
        <label class="wide">材料 <small>1行に「量 | 単位 | 材料名」。量を省く場合は「材料名」だけでもOK</small><textarea id="ingredientsField" rows="7" placeholder="300 | g | 鶏もも肉&#10;1 | 個 | 玉ねぎ&#10;塩・こしょう（適量）"></textarea></label>
        <label class="wide">工程 <small>1行を1工程として登録します</small><textarea id="stepsField" rows="8" placeholder="材料を切ります。&#10;フライパンを中火で熱します。"></textarea></label>
        <label class="wide">出典URL<input id="sourceField" type="url" placeholder="https://…"></label>
        <label class="wide">動画URL<input id="videoField" type="url" placeholder="https://youtube.com/…"></label>
      </div>
      <p class="form-message" id="formMessage" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="secondary-button" data-action="close-editor">キャンセル</button><button type="submit" class="primary-button">下書きを保存</button></div>
    </form>
  </dialog>

  <section class="cook-mode hidden" id="cookMode" aria-label="調理ナビ">
    <header>
      <button class="cook-close" data-action="stop-cooking">× 終了</button>
      <div><span id="cookTitle"></span><strong id="stepCounter"></strong></div>
      <button class="cook-voice" id="cookVoice" aria-pressed="false" aria-label="音声操作をONにする">○ 音声操作 OFF</button>
    </header>
    <div class="cook-body">
      <div class="step-rail" id="stepRail"></div>
      <article class="current-step">
        <p class="eyebrow">CURRENT STEP</p>
        <div class="step-number" id="stepNumber"></div>
        <p id="stepText"></p>
        <form class="cook-command" id="cookCommandForm">
          <label class="sr-only" for="cookCommandInput">調理コマンド</label>
          <input id="cookCommandInput" type="text" enterkeyhint="send" placeholder="次へ・戻って・読み上げ・5分タイマー">
          <button type="submit">実行</button>
        </form>
        <div class="timer-panel">
          <div><span>タイマー</span><strong id="timerDisplay">00:00</strong></div>
          <div class="timer-presets"><button data-minutes="3">3分</button><button data-minutes="5">5分</button><button data-minutes="10">10分</button><button data-action="timer-stop">停止</button></div>
        </div>
      </article>
    </div>
    <footer><button id="prevStep">戻る</button><button id="speakStep">読み上げる</button><button class="next-step" id="nextStep">次へ</button></footer>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
