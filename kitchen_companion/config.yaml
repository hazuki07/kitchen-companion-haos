name: Kitchen Companion
version: "0.1.33"
slug: kitchen_companion
description: 音声と大きな画面で調理を案内する、タブレット向け料理アシスタント
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_icon: mdi:chef-hat
panel_title: 料理アシスタント
panel_admin: false
backup: cold
stage: experimental
map:
  - type: app_config
    read_only: true
options:
  mode: stage
  timer_script_entity_id: ""
  shopping_list_entity_id: "todo.shopping_list"
  task_list_entity_id: ""
  jev_enabled: false
  jev_api_key: ""
  openai_generation_enabled: false
  openai_model: "gpt-6-luna"
  openai_api_key: ""
schema:
  mode: list(stage|prototype|home_assistant)
  timer_script_entity_id: str
  shopping_list_entity_id: str
  task_list_entity_id: str
  jev_enabled: bool
  jev_api_key: password
  openai_generation_enabled: bool
  openai_model: str
  openai_api_key: password
