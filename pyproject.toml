[project]
name = "kitchen-companion"
version = "0.1.0"
description = "Tablet-first cooking assistant for Home Assistant OS"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
